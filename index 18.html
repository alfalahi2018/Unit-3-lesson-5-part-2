<script>
const N=a=>a.map(t=>({t}));
const SP=[['train','#FF9CCB'],['plane','#B9A2FF'],['bus','#FFC845'],['ship','#8CF0CF'],['car','#FF9CCB'],['camel','#B9A2FF'],['bicycle','#FFC845'],['rocket','#8CF0CF']];
const ST=['People have travelled by train for more than 200 years, for work, days out and holidays. Read about two famous railways.','The Haramain High-Speed railway in Saudi Arabia runs between the holy cities of Makkah and Madinah and also stops at Jeddah. Trains can travel at 300 kilometres an hour, so it does not take long to go along the 450-kilometre railway. The line opened in 2018 and has more than 50 bridges and 12 places where camels can cross! Trains are designed to run in temperatures of 50°C.','The Trans-Siberian railway from Moscow to Vladivostok in Russia is the longest railway in the world. It’s more than 9,000 kilometres long. You get on the train in Europe and you get off it in Asia! You sleep on the train, so you need to bring your pyjamas and toothbrush!','The train goes past Lake Baikal, the deepest lake in the world. There are restaurants on the train, but most people take lots of food in their suitcases, too.','WOW! You can get off the Trans-Siberian train to buy food, but you have to do it quickly. Sometimes the train only stops for ten minutes!'];
const GL=[['A','If going on slow but amazing train rides is what you like, you should buy a ticket for the Glacier Express. This famous railway in Switzerland travels between Zermatt and St. Moritz. It takes about eight hours to travel 290 kilometres through high mountains, deep valleys and beautiful forests. The train goes through ninety-one tunnels and over hundreds of bridges. The highest part of the journey is the Oberalp Pass, which is about 2,130 metres high. The train’s very large windows will let you enjoy a fantastic view. Don’t forget your camera!']];
const HT=N(['Haramain High-Speed','Trans-Siberian']);
const A=[
{n:'1 · Royal rides',min:3,type:'mind'},
{n:'2 · Before you read',min:2,type:'mc',q:[
{pr:'A <b>railway</b> is a system of metal tracks and the trains that run on them.',o:N(['True','False']),a:0},
{pr:'<b>High-speed</b> means ___.',o:N(['very fast','very old','very small']),a:0},
{pr:'To <b>cross</b> a bridge means to ___.',o:N(['sleep on it','go from one side to the other','paint it']),a:1},
{pr:'You wear <b>pyjamas</b> when you ___.',o:N(['sleep','swim','play football']),a:0}]},
{n:'3 · Listen and read',min:4,type:'story'},
{n:'4 · Which railway?',min:3,type:'mc',q:[
{pr:'It’s the longest railway in the world.',o:HT,a:1},
{pr:'The people on the train go from Europe to Asia.',o:HT,a:1},
{pr:'The train travels at 300 kmh.',o:HT,a:0},
{pr:'You start in Makkah and finish in Madinah.',o:HT,a:0},
{pr:'It travels next to the deepest lake in the world.',o:HT,a:1}]},
{n:'5 · True or false',min:4,type:'mc',q:[
{pr:'The Haramain High-Speed railway only stops at two places.',o:N(['True','False']),a:1,ex:'It stops in Makkah, Jeddah and Madinah.'},
{pr:'The Haramain trains are not very fast.',o:N(['True','False']),a:1,ex:'They can travel at 300 kilometres an hour.'},
{pr:'The Haramain trains do not have problems in the hot Saudi summers.',o:N(['True','False']),a:0,ex:'Trains are designed to run in temperatures of 50°C.'},
{pr:'The Trans-Siberian journey is longer than 9,000 kilometres.',o:N(['True','False']),a:0,ex:'It’s more than 9,000 kilometres long.'},
{pr:'You can finish the Trans-Siberian journey in one day.',o:N(['True','False']),a:1,ex:'You sleep on the train.'},
{pr:'Not many people take food on the Trans-Siberian train.',o:N(['True','False']),a:1,ex:'Most people take lots of food in their suitcases.'}]},
{n:'6 · Glacier Express',min:4,type:'mc',lines:GL,pitch:1.1,q:[
{pr:'If going on ___ but amazing train rides is what you like...',o:N(['slow','fast','short']),a:0},
{pr:'...you should buy a ___ for the Glacier Express.',o:N(['camera','ticket','suitcase']),a:1},
{pr:'This ___ railway in Switzerland travels between Zermatt and St. Moritz.',o:N(['new','small','famous']),a:2},
{pr:'It takes about ___ hours to travel 290 kilometres.',o:N(['two','eight','twenty']),a:1},
{pr:'...through high mountains, deep ___ and beautiful forests.',o:N(['bridges','valleys','tunnels']),a:1},
{pr:'The train goes through ninety-one ___ and over hundreds of bridges.',o:N(['cities','stations','tunnels']),a:2},
{pr:'The train’s very large ___ will let you enjoy a fantastic view.',o:N(['windows','doors','seats']),a:0},
{pr:'Don’t forget your ___!',o:N(['pyjamas','camera','ticket']),a:1}]},
{n:'7 · What does it mean?',min:2,type:'mc',q:[
{pr:'What does <b>300</b> refer to in the text?',o:N(['The speed of the Haramain trains (km per hour)','The length of the Trans-Siberian railway','The number of bridges']),a:0},
{pr:'What does <b>12</b> refer to in the text?',o:N(['Hours of the journey','Places where camels can cross','Cities on the line']),a:1},
{pr:'What does <b>9,000</b> refer to in the text?',o:N(['Kilometres: the length of the Trans-Siberian railway','The year the line opened','Passengers per day']),a:0},
{pr:'What is <b>Lake Baikal</b>?',o:N(['The longest lake in the world','The deepest lake in the world','The biggest city in Russia']),a:1},
{pr:'What does <b>50°C</b> refer to?',o:N(['The temperature the trains are designed to run in','The speed of the train','The age of the railway']),a:0}]},
{n:'8 · Final task',min:3,type:'cloze'}];
const CL=7;
const C={t:'The {0} (1) railway runs between Makkah and Madinah and also stops at Jeddah. Its trains can travel at {1} (2) kilometres an hour. The Trans-Siberian railway is the {2} (3) railway in the world. You sleep on the train, so you need to bring your {3} (4) and toothbrush! The train goes past Lake {4} (5), the deepest lake in the world.',o:[['Glacier','Haramain','Siberian'],['50','450','300'],['fastest','longest','oldest'],['camera','pyjamas','ticket'],['Victoria','Baikal','Geneva']],a:[1,2,1,1,1]};
const nst=()=>({i:0,pk:null,sc:0,done:false,ans:{},chk:false,sh:false,seen:{},hl:null});
let S={step:0,st:A.map(nst)};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function playT(L,p){try{speechSynthesis.cancel();L.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;u.pitch=p||1;if(S.step===2)u.onstart=()=>{S.st[2].hl=i;render()};speechSynthesis.speak(u)})}catch(e){}}
const GOOD=()=>tone([523,659,784,1047],.1,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);try{speechSynthesis.cancel()}catch(e){}S.step=k;render()}
function play(){const a=A[S.step];playT(a.lines.map(l=>l[1]),a.pitch)}
function scr(){S.st[S.step].sh=!S.st[S.step].sh;render()}
function mind(k){const s=S.st[0];s.seen[k]=1;s.sc=Object.keys(s.seen).length;tone([660+k*40,880+k*40],.1);say(SP[k][0]);render()}
function line(i){S.st[2].hl=i;say(ST[i]);render()}
function playS(){playT(ST)}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){S.st[S.step]=nst();tone([440,523],.1);render()}
function cl(g,i){const s=S.st[CL];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[CL];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s.slice(0,CL).reduce((x,y)=>x+y.sc,0)+(s[CL].chk?C.a.filter((a,g)=>s[CL].ans[g]===a).length:0)}
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="big-stamp">'+s.sc+' / '+n+'</div><div class="fb" style="text-align:center">'+(s.sc===n?'Excellent! Royal work!':s.sc>=n-2?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<CL?'<button class="go" onclick="go('+(S.step+1)+')">Next station →</button>':'')+'</div></div>';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 const au=a.lines?'<div class="row" style="justify-content:flex-start"><button class="go alt" style="padding:8px 24px;font-size:18px" onclick="play()">▶ Listen</button><button class="go" style="padding:8px 24px;font-size:18px" onclick="scr()">'+(s.sh?'Hide':'Show')+' the script</button></div>'+(s.sh?'<div class="scr">'+a.lines.map(l=>l[1]).join('<br>')+'</div>':''):'';
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Jewels: '+s.sc+'</span></div>'+au+'<div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')"><span>'+o.t+'</span></button>').join('')+'</div><div class="fb">'+(lk?(ok?'<span class="stamp">SPARKLING!</span>':'<span class="stamp no">TRY AGAIN</span>')+'The answer is: '+q.o[q.a].t+'. '+(q.ex||''):'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 if(a.type==='mind')return '<div class="card"><h2>'+a.n+' · '+a.min+' min — How can you travel on holiday? Tap and listen!</h2><div class="mid">Royal<br>rides</div><div class="row" style="justify-content:center">'+SP.map((w,k)=>'<button class="bub'+(s.seen[k]?' seen':'')+'" style="background:'+w[1]+'" onclick="mind('+k+')">'+w[0]+'</button>').join('')+'</div><div class="learn"><b>Think:</b> Which is your favourite way to travel? Why? Tell your partner!</div><div class="fb">Words heard: '+s.sc+' / '+SP.length+'</div><button class="go alt" onclick="go(1)">Before you read →</button></div>';
 if(a.type==='story')return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min — Famous railways</span><button class="go alt" style="padding:8px 24px;font-size:18px" onclick="playS()">▶ Listen to the text</button></div><div class="dl">'+ST.map((t,i)=>'<button class="s'+(s.hl===i?' sel':'')+'" onclick="line('+i+')">'+t+'</button>').join('')+'</div><button class="go" onclick="go(3)">Questions →</button></div>';
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card"><div class="meta"><span>Finishing the lesson · Reading</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i))+'</div>'+C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i,cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('')+(s.chk?'<div class="big-stamp">'+n+' / 5</div>':'')+'<div class="row"><span style="margin-right:auto;font-size:20px;font-weight:700">'+(s.chk?(n===5?'Excellent! You are a royal explorer!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'Answer all 5 items, then press Check.')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit">Created by T.Badria Alfalahi</div></div>'}
function render(){
 const L=A.length-1;
 document.getElementById('nav').innerHTML='<span>Choose your station:</span>'+A.map((a,k)=>'<button class="'+(k===S.step?'on':'')+'" onclick="go('+k+')">'+a.n+'</button>').join('');
 document.getElementById('stars').textContent=stars();
 document.getElementById('pl').style.left=(S.step/L*100)+'%';
 document.getElementById('stations').innerHTML=A.map((a,k)=>'<span class="st'+(k<=S.step?' on':'')+'" style="left:'+(k/L*100)+'%"></span>').join('');
 document.getElementById('main').innerHTML=view()}
render();
